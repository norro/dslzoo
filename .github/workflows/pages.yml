# Builds the site from dslzoo.bib with generator/build.py and publishes it with
# GitHub Pages through GitHub Actions. The gh-pages branch stays untouched as the
# frozen legacy site: switching the Pages source back to it restores that site.
# Pushes to ai/dslzoo-refresh deploy the fork (norro.github.io/dslzoo); pushes to
# master deploy corlab once this file has been released there.
name: Deploy site

on:
  push:
    branches: [master, ai/dslzoo-refresh]
    paths:
      - .github/workflows/pages.yml
      - dslzoo.bib
      - docs/STABLE-REFERENCES.md
      - generator/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m venv .venv && .venv/bin/pip install -r generator/requirements.txt
      - run: .venv/bin/python generator/build.py site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
